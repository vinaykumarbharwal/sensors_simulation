spring.application.name=forest-fire-detection

# Server config
server.port=${PORT:8081}

# Production configuration must be supplied through environment variables.
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.error.whitelabel.enabled=false

# Data retention
app.readings.retention-days=7
app.readings.retention-cron=0 0 2 * * *

# Logging
logging.level.com.forestfire=INFO
logging.level.org.springframework.web=WARN

# Auth / JWT
app.security.enforce=${APP_SECURITY_ENFORCE:true}
app.web.allowed-origins=${FRONTEND_ORIGINS}
app.security.jwt-secret=${JWT_SECRET}
app.security.jwt-expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.security.employee.username=${EMPLOYEE_USERNAME}
app.security.employee.password=${EMPLOYEE_PASSWORD}
app.security.head.username=${HEAD_USERNAME}
app.security.head.password=${HEAD_PASSWORD}
