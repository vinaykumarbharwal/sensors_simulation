spring.datasource.url=jdbc:h2:mem:forestfiredb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Keep the server port same as default
server.port=8081

# Disable scheduled simulation in local profile to avoid runtime insert errors
spring.task.scheduling.enabled=false

# Skip database bootstrap writes during local runs so H2 can start cleanly
app.bootstrap.enabled=false

# Keep local development permissive and pointed at the Vite dev server.
app.security.enforce=false
app.web.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5180,http://127.0.0.1:5180

# Auth / JWT local defaults
app.security.jwt-secret=forest-fire-jwt-secret-must-be-32-chars-minimum-key
app.security.jwt-expiration-ms=86400000
app.security.employee.username=employee
app.security.employee.password=employee123
app.security.head.username=head
app.security.head.password=head123
