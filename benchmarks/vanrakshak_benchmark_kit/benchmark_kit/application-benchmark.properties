# ============================================================================
# BENCHMARK PROFILE — for local load testing only.
# This changes NO business logic, only wiring/config, so the scheduler and
# security run in a realistic mode against a disposable local database.
#
# Usage:
#   cp application-benchmark.properties forest-fire-backend/src/main/resources/
#   mvn spring-boot:run -Dspring-boot.run.profiles=benchmark
#
# Differs from application-local.properties in two important ways:
#   1. spring.task.scheduling.enabled is NOT disabled -> the real 20s
#      SensorScheduler / SensorSimulationService.simulateAll() job runs,
#      which Step 4 of the benchmark needs.
#   2. app.security.enforce=true -> JWT auth path is exercised for a
#      realistic API benchmark (matches production security.enforce default).
# ============================================================================

spring.application.name=forest-fire-detection-benchmark

server.port=8081

# Disposable in-memory H2 database, MySQL-compatible dialect mode.
# No external DB, no credentials needed.
spring.datasource.url=jdbc:h2:mem:benchmarkdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Data retention (kept identical to production default)
app.readings.retention-days=7
app.readings.retention-cron=0 0 2 * * *

# Keep the real scheduled simulation running for Step 4 measurements.
# (application-local.properties sets this to false — we deliberately don't.)
spring.task.scheduling.enabled=true
app.bootstrap.enabled=true

logging.level.com.forestfire=INFO
logging.level.org.springframework.web=WARN

# Auth ON, using local-only defaults — never your real credentials.
app.security.enforce=true
app.web.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
app.security.jwt-secret=benchmark-only-jwt-secret-must-be-32-chars-minimum-key
app.security.jwt-expiration-ms=86400000
app.security.employee.username=employee
app.security.employee.password=employee123
app.security.head.username=head
app.security.head.password=head123
